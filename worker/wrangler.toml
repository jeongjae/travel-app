# 기본 환경은 로컬 `wrangler dev` 전용이다. 운영은 [env.production]이며 `wrangler deploy --env production`으로만 올린다.
# 비밀값(OPENAI_API_KEY·TOKEN_SECRET·REGISTRATION_CODE)은 여기에 쓰지 않는다. `wrangler secret put ... --env production`.
# 기본 환경 name은 운영(travel-app-ai)과 다르게 둔다. --env production 없이 deploy해도 운영 스크립트를 덮지 않게 하는 안전장치(R1).
name = "travel-app-ai-dev"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[vars]
# WebAuthn RP ID와 허용 origin. 운영 값(jeongjae.github.io)은 배포 환경 설정으로 바꾼다. 코드 분기는 없다.
RP_ID = "localhost"
RP_NAME = "travel-app"
ALLOWED_ORIGINS = "http://localhost:5173,http://localhost:4173"
OPENAI_BASE = "https://api.openai.com/v1"
OPENAI_MODEL = "gpt-5.4-mini"

[[durable_objects.bindings]]
name = "AI_STORE"
class_name = "AiStoreObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AiStoreObject"]

# 운영(T-D4): 공개 주소 workers.dev, Pages origin만 허용, 일일 5회. E2E_RESET은 설정하지 않는다.
# 환경은 [vars]·바인딩·마이그레이션을 상속하지 않으므로 모두 다시 적는다.
[env.production]
name = "travel-app-ai"
workers_dev = true
# 기본으로 켜지는 Preview URL을 끈다. 같은 Worker·비밀값을 가리키는 공개 주소가 늘어나는 것을 막는다.
preview_urls = false

[env.production.vars]
RP_ID = "jeongjae.github.io"
RP_NAME = "travel-app"
ALLOWED_ORIGINS = "https://jeongjae.github.io"
OPENAI_BASE = "https://api.openai.com/v1"
OPENAI_MODEL = "gpt-5.4-mini"
DAILY_LIMIT = "5"

[[env.production.durable_objects.bindings]]
name = "AI_STORE"
class_name = "AiStoreObject"

[[env.production.migrations]]
tag = "v1"
new_sqlite_classes = ["AiStoreObject"]
