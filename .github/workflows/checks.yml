name: travel-app required checks

# Reusable: ci.yml and pages.yml call this so both run the same commands on the caller's commit.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  # Format, lint, unit tests, build and pilot checks. No browsers.
  static:
    # ubuntu-latest became 26.04 (2026-11), which has no Python 3.12.7 build for setup-python; pin until .python-version moves.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: corepack install
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip --cache-dir .cache/pip install -r requirements-extract.txt
      - run: .venv/bin/python -m pip check
      # Includes the formatting check; the build alone does not enforce readable source.
      - run: pnpm run check
      - run: pnpm run check:pilot

  # The whole E2E suite, split so the wall time is one shard instead of the sum (2026-11-20).
  # Chromium projects (desktop, mobile) run in three shards; the WebKit project runs on its own
  # so only that job pays for WebKit's system packages.
  e2e:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: chromium 1/3
            browsers: chromium
            install: --with-deps chromium
            args: --project=desktop --project=mobile --shard=1/3
          - name: chromium 2/3
            browsers: chromium
            install: --with-deps chromium
            args: --project=desktop --project=mobile --shard=2/3
          - name: chromium 3/3
            browsers: chromium
            install: --with-deps chromium
            args: --project=desktop --project=mobile --shard=3/3
          # Installing WebKit's system packages with apt took 13 minutes on the hosted runner (2026-11-20).
          # Playwright's own image already has them; keep its tag equal to @playwright/test in package.json.
          - name: webkit
            browsers: webkit
            install: webkit
            container: mcr.microsoft.com/playwright:v1.64.1-noble
            args: --project=webkit-iphone
    name: e2e (${{ matrix.name }})
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: corepack install
      - run: pnpm install --frozen-lockfile
      # scripts/playwright.mjs keeps browsers in .cache/ms-playwright; the lockfile pins the Playwright version.
      - uses: actions/cache@v6
        with:
          path: .cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browsers }}-${{ hashFiles('pnpm-lock.yaml') }}
      # The preview server serves dist; the static job's build is not shared between jobs.
      - run: pnpm run build
      - run: node scripts/playwright.mjs install ${{ matrix.install }}
      - run: node scripts/playwright.mjs test ${{ matrix.args }}
