name: travel-app required checks

# Reusable: ci.yml and pages.yml call this so both run the same commands on the caller's commit.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
      - run: corepack enable
      - run: corepack install
      - run: pnpm install --frozen-lockfile
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip --cache-dir .cache/pip install -r requirements-extract.txt
      - run: .venv/bin/python -m pip check
      # Includes the formatting check; the build alone does not enforce readable source.
      - run: pnpm run check
      - run: pnpm run check:pilot
      - run: node scripts/playwright.mjs install --with-deps chromium
      - run: pnpm run test:e2e
